<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181a26" />
      <stop offset="45%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#08090e" />
    </radialGradient>

    <!-- Amber Quantum Core Gradient -->
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Telemetry Wave Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Ambient Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Subtle Horizon Grid Lines -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <circle cx="960" cy="540" r="300" fill="none" />
    <circle cx="960" cy="540" r="500" fill="none" />
  </g>

  <!-- Centered DIAD Quantum Prism Emblem -->
  <g transform="translate(960, 480) scale(4.5)" filter="url(#glow)">
    <!-- Outer Titanium Prism -->
    <polygon
      points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18"
      stroke="url(#amber-glow)"
      stroke-width="2.5"
      fill="#13151f"
      stroke-linejoin="round"
    />

    <!-- Inner Intelligence Nodes -->
    <polygon
      points="0,-26 23,-13 23,13 0,26 -23,13 -23,-13"
      fill="rgba(245, 158, 11, 0.08)"
      stroke="rgba(245, 158, 11, 0.35)"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Dynamic Quantum Core -->
    <circle cx="0" cy="0" r="7.5" fill="url(#amber-glow)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />

    <!-- Telemetry Pulse Wave -->
    <path
      d="M-15,0 L-7,0 L-3,-7 L3,7 L7,0 L15,0"
      stroke="url(#cyan-glow)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Typography & App Launcher Prompt -->
  <g text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Noto Sans', system-ui, sans-serif">
    <text x="960" y="730" font-size="28" font-weight="900" letter-spacing="8" fill="#f8fafc">
      DIAD 2040 AUTONOMOUS AGENT
    </text>
    <text x="960" y="775" font-size="14" font-weight="600" letter-spacing="3" fill="#f59e0b">
      PRESS F1 OR SUPER+1 TO LAUNCH AGENT · CLICK WAYBAR TO SWITCH
    </text>
  </g>
</svg>
