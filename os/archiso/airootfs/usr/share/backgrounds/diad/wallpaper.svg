<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Refined Ambient Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="50%" stop-color="#0d0e15" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>
  </defs>

  <!-- Solid Ambient Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Clean OpenAI/Anthropic-Style Minimalist Typography -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <!-- DIAD Wordmark -->
    <text x="960" y="520" font-size="72" font-weight="700" letter-spacing="28" fill="#f8fafc">
      DIAD
    </text>

    <!-- Subtitle -->
    <text x="960" y="580" font-size="14" font-weight="600" letter-spacing="8" fill="#94a3b8">
      INTENT-DRIVEN OPERATING SYSTEM
    </text>

    <!-- Keybinding Helper -->
    <text x="960" y="630" font-size="12" font-weight="500" letter-spacing="3" fill="#64748b">
      PRESS F1 OR SUPER+1 TO LAUNCH AGENT · CLICK WAYBAR TO SWITCH
    </text>
  </g>
</svg>
