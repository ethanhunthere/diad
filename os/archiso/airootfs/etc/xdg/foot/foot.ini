# =============================================================================
# DIAD OS — Foot Terminal Configuration (Industrial Basalt & Crimson Theme)
# =============================================================================
font=JetBrains Mono:size=11, DejaVu Sans Mono:size=11, monospace:size=11
font-bold=JetBrains Mono:weight=bold:size=11
font-italic=JetBrains Mono:slant=italic:size=11
pad=10x10

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.98
background=0F1110
foreground=E5EAE6
cursor=090A0A B32032

## Normal / Regular colors (Industrial Basalt & Crimson Palette)
regular0=090A0A
regular1=B32032
regular2=38A169
regular3=D97706
regular4=4A5568
regular5=8A968E
regular6=525D56
regular7=E5EAE6

## Bright colors
bright0=1E2321
bright1=D32F2F
bright2=48BB78
bright3=F59E0B
bright4=718096
bright5=A0AEC0
bright6=CBD5E1
bright7=FFFFFF

[scrollback]
lines=10000
multiplier=3.0

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n

[mouse-bindings]
primary-paste=BTN_MIDDLE
select-extend=BTN_RIGHT
