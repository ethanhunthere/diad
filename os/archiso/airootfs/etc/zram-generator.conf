# =============================================================================
# DIAD — zram swap (spec 4.2)
# =============================================================================
# Compressed swap in RAM: on low-memory machines this buys headroom without
# touching the (possibly slow) disk. zstd gives the best size/speed mix.
#
# The size below is the default (50% of RAM). On ULTRA_LOW machines
# (<= 2 GB RAM) diad-perf-tier.sh rewrites it to 100% at boot and restarts
# the zram setup — one file, tier-aware, no extra daemon.

[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
