# =============================================================================
# DIAD — NetworkManager configuration
# =============================================================================
# Forces the keyfile backend (stable, human-readable connection profiles) and
# enables connectivity checking so the DIAD Agent can reliably report network
# state. Wi-Fi scan MAC randomization is on by default for privacy.

[main]
plugins=keyfile

[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=60

[device]
wifi.scan-rand-mac-address=yes
