# =============================================================================
# DIAD — kernel runtime tuning (spec 4.1)
# =============================================================================
# Applied by systemd-sysctl.service at boot. Every value favors a
# responsive interactive desktop on modest hardware.

# Swap: prefer evicting anonymous pages late — keeps file-backed UI assets
# resident while still allowing zram to absorb pressure spikes.
vm.swappiness = 10

# Reclaim dentries/inodes faster than page cache: file CONTENTS (fonts,
# GUI assets) stay hot; directory metadata is cheap to re-read.
vm.vfs_cache_pressure = 50

# Writeback: bound dirty page bursts so a background write never stalls
# the UI thread for long.
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Keep the default heuristic overcommit mode (never overcommit wildly).
vm.overcommit_memory = 0

# Autogroup scheduling: better desktop feel when many processes compete
# (spec 4.9 — keep CFS/EEVDF defaults, just autogroup on).
kernel.sched_autogroup_enabled = 1

# Fair-queueing qdisc: lower tail latency for interactive traffic.
net.core.default_qdisc = fq_codel
