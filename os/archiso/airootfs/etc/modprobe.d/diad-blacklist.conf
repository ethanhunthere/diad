# =============================================================================
# DIAD — kernel module blacklist (spec 4.7)
# =============================================================================
# Modules DIAD never needs: blacklisting them saves kernel memory and
# shrinks the attack surface. None of these are required to boot the ISO
# or run the agent (floppy/PC speaker/legacy filesystems).
blacklist floppy
blacklist pcspkr
blacklist snd_pcsp
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf
