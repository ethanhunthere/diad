# =============================================================================
# DIAD — tlp only on laptops (P3-S2.4)
# =============================================================================
# tlp manages battery power; on a desktop the service would idle doing
# nothing useful. ConditionPathExistsGlob activates tlp only when a battery
# (BAT*) is actually present. No battery → unit is skipped, zero boot cost.
# =============================================================================

[Unit]
ConditionPathExistsGlob=/sys/class/power_supply/BAT*
