# =============================================================================
# DIAD — journald tuning (P3-S2.4)
# =============================================================================
# Boot-time + runtime logging policy for the live system:
#   Storage=volatile       — the live system runs from RAM/media; journal goes
#                            to tmpfs, never the read-only rootfs. Nothing to
#                            flush at shutdown, no disk writes during boot.
#   MaxLevelConsole=warning — keep the console quiet on the default boot; only
#                            warnings and worse reach tty1/serial.
#   ForwardToConsole=no    — systemd never pushes messages to the console
#                            itself (kernel loglevel already controls that).
# =============================================================================

[Journal]
Storage=volatile
MaxLevelConsole=warning
ForwardToConsole=no
