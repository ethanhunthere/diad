# DIAD — safe power-key defaults.
# Default logind behavior powers the machine OFF when the power button is
# pressed — one accidental press (or a VM/front-panel key event) killed live
# sessions. DIAD locks instead; real shutdown goes through the waybar power
# menu (diad-power.sh), which asks for confirmation via wofi.
[Login]
HandlePowerKey=lock
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
