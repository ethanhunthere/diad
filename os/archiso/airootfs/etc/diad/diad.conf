# =============================================================================
# DIAD Agent — System Configuration
# =============================================================================
# This is the system-wide configuration file for the DIAD Agent.
# User-specific overrides can be placed at ~/.config/diad/config.toml
# =============================================================================

# Default LLM provider (anthropic, gemini, openai, qwen)
default_provider = "anthropic"

# Paths that the agent's tools are allowed to access
allowed_paths = ["~", "/tmp", "/etc/diad"]

# Log level: trace, debug, info, warn, error
log_level = "info"

# UI theme: dark, light
theme = "dark"

# Stream LLM tokens in real-time
stream_tokens = true

# Require confirmation before destructive actions
# (file deletion, package removal, service disable, etc.)
confirm_destructive = true

# Maximum conversation history to keep in memory
max_history = 100

# Auto-save interval in seconds (0 = disabled)
auto_save_interval = 300

# Persistent storage location
# Directory where persistent user data lives (e.g. ~/Documents, ~/Downloads
# symlink here). Backed by the DIAD-DATA partition when present.
[storage]
persistent_path = "/home/diad/data"

# Custom keybindings (uncomment to override defaults)
# [keybindings]
# quit = "Ctrl+C"
# submit = "Enter"
# clear = "Ctrl+L"
# switch_chat = "F1"
# switch_files = "F2"
# switch_code = "F3"
# switch_system = "F4"

# Provider-specific settings
# [providers.anthropic]
# model = "claude-sonnet-4-20250514"
# max_tokens = 4096

# [providers.gemini]
# model = "gemini-2.5-flash"
