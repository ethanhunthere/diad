# P3-S2.3 — initramfs diet: drop memdisk + all archiso_pxe_* hooks (their
# tooling — memdiskfind, ipconfig, nbd-client, nfsmount — is not in the ISO
# package set, so they only produced "not found" noise and added size).
# zstd: smaller image than xz -9e AND far faster single-threaded
# decompression in the kernel — a direct win on time-to-login.
# NOTE: hook ORDER matters at runtime — archiso/archiso_loop_mnt must stay
# before block/filesystems (the archiso hook mounts the rootfs itself).
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-1 -T0)
