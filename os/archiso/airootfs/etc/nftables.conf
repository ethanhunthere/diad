# =============================================================================
# DIAD — nftables firewall ruleset
# =============================================================================
# Default-deny inbound firewall:
#   - input:  drop by default; allow loopback, established/related traffic,
#             and SSH (port 22)
#   - forward: drop by default (no routing between interfaces)
#   - output: allow everything
#
# Applied by diad-firewall.service (systemd oneshot unit).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iif "lo" accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
