# =============================================================================
# DIAD — Universal Media & Backlight Key Bindings
# =============================================================================
# Active on all laptops, desktops, and external keyboards.
# =============================================================================

# Screen brightness
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Volume (PipeWire / WirePlumber)
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media playback (playerctl)
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioStop exec playerctl stop

# Airplane mode toggle
bindsym XF86RFKill exec /usr/local/bin/diad-rfkill

# Quick launcher shortcuts
bindsym $mod+n exec /usr/local/bin/diad-wifi.sh
bindsym $mod+p exec /usr/local/bin/diad-power.sh

# Lock screen bindings (Hardware lock key, Ctrl+Alt+L)
bindsym XF86ScreenSaver exec /usr/local/bin/diad-lock
bindsym Control+Mod1+l exec /usr/local/bin/diad-lock
