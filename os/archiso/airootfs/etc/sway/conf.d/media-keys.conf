# =============================================================================
# DIAD — Universal Media & Backlight Key Bindings (Edition)
# =============================================================================
# Active on all laptops, desktops, and external keyboards.
# =============================================================================

# Screen brightness (smooth 5% steps)
bindsym XF86MonBrightnessUp exec brightnessctl set +5% && notify-send "Brightness" "$(brightnessctl get) / $(brightnessctl max)" -t 1000 -h string:x-canonical-private-synchronous:brightness
bindsym XF86MonBrightnessDown exec brightnessctl set 5%- && notify-send "Brightness" "$(brightnessctl get) / $(brightnessctl max)" -t 1000 -h string:x-canonical-private-synchronous:brightness

# Volume (PipeWire / WirePlumber)
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && notify-send "Volume" "Volume Up" -t 1000 -h string:x-canonical-private-synchronous:volume
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send "Volume" "Volume Down" -t 1000 -h string:x-canonical-private-synchronous:volume
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send "Volume" "Mute Toggled" -t 1000 -h string:x-canonical-private-synchronous:volume
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send "Microphone" "Mic Mute Toggled" -t 1000

# Media playback (playerctl)
bindsym XF86AudioPlay exec playerctl play-pause 2>/dev/null
bindsym XF86AudioNext exec playerctl next 2>/dev/null
bindsym XF86AudioPrev exec playerctl previous 2>/dev/null
bindsym XF86AudioStop exec playerctl stop 2>/dev/null

# Airplane mode toggle (Wi-Fi radio)
bindsym XF86RFKill exec sh -c 'if nmcli radio wifi | grep -q enabled; then nmcli radio wifi off && notify-send "Wi-Fi" "Radio OFF"; else nmcli radio wifi on && notify-send "Wi-Fi" "Radio ON"; fi'

# Quick launcher shortcuts
bindsym $mod+n exec /usr/local/bin/diad-wifi.sh
bindsym $mod+p exec /usr/local/bin/diad-power.sh
