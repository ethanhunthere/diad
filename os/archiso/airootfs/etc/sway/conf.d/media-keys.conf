# =============================================================================
# DIAD — Laptop media & backlight key bindings
# =============================================================================
# Included from /etc/sway/config (see the `include` directive).
#
# On laptops, diad-hardware-setup.sh uncomments these bindings so the media
# and backlight keys work. On desktops the file stays fully commented and no
# bindings are active.
#
# Note: brightnessctl writes and nmcli radio need root — both are whitelisted
# for the diad user in /etc/sudoers.d/diad.
# =============================================================================

# Screen brightness
# bindsym XF86MonBrightnessUp exec sudo brightnessctl set +10%
# bindsym XF86MonBrightnessDown exec sudo brightnessctl set -10%

# Volume (WirePlumber)
# bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_SINK@ 5%+
# bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_SINK@ 5%-
# bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_SINK@ toggle

# Media playback (playerctl)
# bindsym XF86AudioPlay exec playerctl play-pause
# bindsym XF86AudioNext exec playerctl next
# bindsym XF86AudioPrev exec playerctl previous

# Airplane mode toggle (Wi-Fi radio)
# bindsym XF86RFKill exec sh -c 'if nmcli radio wifi | grep -q enabled; then sudo nmcli radio wifi off; else sudo nmcli radio wifi on; fi'
