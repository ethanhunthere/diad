# =============================================================================
# DIAD OS — GRUB Boot Configuration (Themed, standard Arch-style)
# =============================================================================

# Load partition table and file system modules (parity with archiso releng).
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# --- Graphical menu (DIAD theme) ---------------------------------------------
# The standalone GRUB EFI binary embeds the unicode font at
# ${prefix}/fonts/unicode.pf2 (mkarchiso's grub-mkstandalone). Load it so
# gfxterm can render the themed menu; fall back to text mode if unavailable.
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod png
    # Fallback resolutions prevent the transient "error: no suitable video
    # mode found" that some UEFI firmware emits when gfxmode=auto fails to
    # probe the GOP mode list. GRUB walks the list left-to-right.
    set gfxmode="auto,1920x1080,1366x768,1024x768,800x600"
    terminal_output gfxterm
fi

# Apply the DIAD theme (grub/themes/ is copied to /boot/grub/themes/ on the ISO).
if [ -e "/boot/grub/themes/grub-theme-diad/theme.txt" ]; then
    set theme="/boot/grub/themes/grub-theme-diad/theme.txt"
fi

# --- Menu --------------------------------------------------------------------
# "DIAD OS" is pre-highlighted (default), but we do NOT auto-boot: timeout=-1
# keeps the menu on screen until the user explicitly selects an entry (click or
# Enter). This is intentional — first boot should land on the menu first, then
# drop into the Setup wizard only after the user picks "DIAD OS".
default=diad
set timeout=-1
set timeout_style=menu

menuentry "DIAD OS" --class diad --class gnu-linux --class gnu --class os --id 'diad' {
    set gfxpayload=keep
    # quiet + loglevel + show_status=no: suppress the kernel/systemd "green"
    # boot text entirely — a clean fade from GRUB straight to the desktop, and
    # measurably faster (no per-line serial console I/O on the firmware).
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% fsck.mode=skip quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=no
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
