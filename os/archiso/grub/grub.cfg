# =============================================================================
# DIAD OS — GRUB boot configuration
# =============================================================================
# Boots the DIAD live environment (linux-lts) from the ISO 9660 file system.
# Placeholders (%INSTALL_DIR%, %ARCH%, %ARCHISO_LABEL%, %ARCHISO_UUID%,
# %ARCHISO_SEARCH_FILENAME%) are substituted by mkarchiso at build time.
# =============================================================================

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf

# Use graphics-mode output (unicode.pf2 is bundled in the EFI image)
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# DIAD GRUB theme (copied to /boot/grub/themes/grub-theme-diad/ by mkarchiso)
if [ -f /boot/grub/themes/grub-theme-diad/theme.txt ]; then
    set theme=/boot/grub/themes/grub-theme-diad/theme.txt
fi

# Default menu entry: boot straight from the media (no copy to RAM).
default=diad
timeout=3
timeout_style=menu

# ---- Menu entries ----
#
# Boot strategy (P3-S2.1): DIAD's rootfs is a 2.9 GB EROFS image. The archiso
# hook defaults copytoram=auto, which copies the whole image to RAM whenever
# the boot device is not an optical drive (i.e. every real USB boot) — a 2–3
# minute stall. We therefore pin copytoram=n on the default and verbose
# entries: the kernel mounts the EROFS straight from the USB stick and the
# desktop appears in seconds. `fsck.mode=skip` + `rd.timeout=10` stop fsck
# and initramfs device probing from ever waiting. A separate RAM mode exists
# for users who want the whole system in RAM (bare `copytoram` = y, progress
# bar via pv) — e.g. after USB removal, at the cost of the one-time copy.

menuentry "DIAD" --class diad --class gnu-linux --class gnu --class os --id 'diad' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.show_status=0 fsck.mode=skip rd.timeout=10 copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

# Verbose boot for debugging (spec 4.5): same kernel, full boot chatter.
menuentry "DIAD (verbose mode)" --class diad --class gnu-linux --class gnu --class os --id 'diad-verbose' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% loglevel=7 fsck.mode=skip rd.timeout=10 copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

# RAM mode: copy the rootfs image to RAM (bare copytoram = y) then run from
# RAM. The USB stick can be removed after the copy finishes. Progress is
# shown by pv (part of the ISO package set).
menuentry "DIAD (RAM mode)" --class diad --class gnu-linux --class gnu --class os --id 'diad-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 copytoram fsck.mode=skip
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
