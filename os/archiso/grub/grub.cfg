# =============================================================================
# DIAD OS — Instant Zero-Delay GRUB Boot Configuration (2040 Edition)
# =============================================================================
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

default=diad
set timeout=0
set timeout_style=hidden

# ---- Instant Direct Kernel Hand-off ----
menuentry "DIAD OS" --class diad --class gnu-linux --class gnu --class os --id 'diad' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet loglevel=0 rd.systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 udev.log_priority=0 fsck.mode=skip audit=0 nowatchdog nosoftlockup systemd.unified_cgroup_hierarchy=1 mitigations=off i915.fastboot=1 copytoram=n systemd.show_status=0 console=tty1 no_timer_check noreplace-smp libahci.ignore_sss=1 raid=noautodetect systemd.default_timeout_start_sec=3s systemd.mask=NetworkManager-wait-online.service systemd.mask=systemd-networkd-wait-online.service
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
