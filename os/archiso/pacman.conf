#
# /etc/pacman.conf for the DIAD ISO build
#
# Profile-local pacman configuration used by mkarchiso when pacstrapping the
# ISO rootfs. Only the official core/extra repositories are enabled — custom
# host repositories (e.g. omarchy) are intentionally NOT included so the ISO
# build is reproducible on any Arch machine.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
