<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAD Apps</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg-deep: #12121f;
    --panel: #241d16;
    --copper: #8b5e3c;
    --copper-bright: #b5794f;
    --text: #ede6de;
    --text-dim: #a89a8a;
    --border: rgba(255, 255, 255, 0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #2b2233 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: "Noto Sans", "DejaVu Sans", sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .shell { text-align: center; padding: 24px; }
  h1 {
    font-size: 26px; font-weight: 300; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
  }
  .tagline { font-size: 13px; color: var(--text-dim); margin-bottom: 40px; }
  .launch {
    display: inline-flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 34px 44px; border-radius: 18px; cursor: pointer;
    background: linear-gradient(180deg, rgba(139, 94, 60, 0.16), rgba(139, 94, 60, 0.05));
    border: 1px solid var(--border);
    transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
  }
  .launch:hover { transform: translateY(-2px); border-color: var(--copper-bright); background: linear-gradient(180deg, rgba(139, 94, 60, 0.28), rgba(139, 94, 60, 0.10)); }
  .launch:active { transform: translateY(0); }
  .launch svg { width: 64px; height: 64px; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45)); }
  .label { font-size: 19px; font-weight: 600; letter-spacing: 0.04em; }
  .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; min-height: 16px; }
  .status { margin-top: 26px; font-size: 12px; color: var(--copper-bright); min-height: 16px; }
</style>
</head>
<body>
  <div class="shell">
    <h1>DIAD Apps</h1>
    <div class="tagline">One tap to open the browser</div>
    <div class="launch" id="launch" role="button" tabindex="0">
      <!-- Browser icon (inline SVG — no font dependency) -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="28" stroke="#b5794f" stroke-width="3"/>
        <ellipse cx="32" cy="32" rx="13" ry="28" stroke="#b5794f" stroke-width="3"/>
        <path d="M14 22h36M14 42h36" stroke="#b5794f" stroke-width="3"/>
        <circle cx="32" cy="32" r="7" fill="#8b5e3c"/>
      </svg>
      <div class="label">Browser</div>
      <div class="sub" id="sub">detecting…</div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const launch = document.getElementById("launch");
    const sub = document.getElementById("sub");
    const status = document.getElementById("status");

    // Label: Brave when the flatpak is installed, otherwise Chromium
    // (chromium always ships on the ISO).
    fetch("/api/v1/launch/status", { cache: "no-store" })
      .then((r) => r.json())
      .then((s) => {
        sub.textContent = s.browser === "brave" ? "Brave" : "Chromium";
      })
      .catch(() => { sub.textContent = "Chromium"; });

    async function openBrowser() {
      status.textContent = "Opening…";
      try {
        const r = await fetch("/api/v1/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ app: "browser" }),
        });
        const j = await r.json();
        status.textContent = r.ok ? "Browser opening (workspace 2)" : (j.error || "Failed to launch");
      } catch (e) {
        status.textContent = "Launch failed";
      }
    }
    launch.addEventListener("click", openBrowser);
    launch.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBrowser(); } });
  </script>
</body>
</html>
