<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAD Browser</title>
<style>
  :root {
    --bg-base: #090A0A;
    --bg-card: rgba(22, 25, 24, 0.94);
    --bg-card-hover: rgba(30, 35, 33, 0.98);
    --border: #202623;
    --border-hover: #B32032;
    --accent: #B32032;
    --crimson: #B32032;
    --text-primary: #E5EAE6;
    --text-secondary: #8A968E;
    --text-dim: #525D56;
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background-color: var(--bg-base); }
  body {
    background: radial-gradient(circle at 50% 30%, #161918 0%, #090A0A 75%);
    color: var(--text-primary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 32px 24px;
    user-select: none;
    overflow-y: auto;
    position: relative;
  }

  /* Fixed Window Top Bar */
  .window-top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 38px;
    background: rgba(15, 17, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 1000;
  }
  .window-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.04em;
  }
  .window-controls {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .win-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 24px;
    border-radius: 6px;
    border: 1px solid #333C37;
    background: #161918;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 120ms ease;
  }
  .win-btn:hover {
    background: #202623;
    color: #FFFFFF;
    border-color: #525D56;
  }
  .win-btn.win-close:hover {
    background: #FF2E4D;
    color: #FFFFFF;
    border-color: #FF2E4D;
  }

  /* Corner Resize Handle */
  .corner-resize-handle {
    position: fixed;
    bottom: 8px;
    right: 8px;
    font-size: 15px;
    font-weight: bold;
    color: var(--text-secondary);
    cursor: se-resize;
    user-select: none;
    z-index: 1000;
    padding: 4px;
    transition: color 120ms ease;
  }
  .corner-resize-handle:hover {
    color: #FF2E4D;
  }

  @keyframes pageSpring {
    from {
      opacity: 0;
      transform: translateY(12px) scale(0.985);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 32px;
    animation: pageSpring 360ms var(--ease-spring) forwards;
  }

  /* Official DIAD Logo Image */
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .diad-official-logo {
    height: 52px;
    width: auto;
    max-width: 220px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
  }
  .subtitle {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Search Input */
  .search-form {
    width: 100%;
    position: relative;
  }
  .search-wrapper {
    display: flex;
    align-items: center;
    width: 100%;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    gap: 12px;
    transition: all 140ms ease;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
  }
  .search-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(179, 32, 50, 0.25), 0 18px 44px rgba(0, 0, 0, 0.8);
    background: rgba(26, 30, 29, 0.98);
  }
  .search-icon {
    width: 20px;
    height: 20px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 15.5px;
    color: var(--text-primary);
    caret-color: var(--accent);
  }
  .search-input::placeholder {
    color: var(--text-dim);
  }

  /* Custom High-Contrast Dark Dropdown */
  .custom-dropdown {
    position: relative;
    user-select: none;
  }
  .dropdown-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1E2321;
    border: 1px solid #202623;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    transition: all 140ms ease;
  }
  .dropdown-trigger:hover {
    background: #262E2A;
    border-color: var(--accent);
    color: #ffffff;
  }
  .chevron-icon {
    width: 13px;
    height: 13px;
    color: var(--text-secondary);
    transition: transform 140ms ease;
  }
  .custom-dropdown.open .chevron-icon {
    transform: rotate(180deg);
  }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 146px;
    background: #161918;
    border: 1px solid #202623;
    border-radius: 10px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.04);
    padding: 5px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 100;
  }
  .custom-dropdown.open .dropdown-menu {
    display: flex;
  }
  .dropdown-item {
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    transition: all 120ms ease;
  }
  .dropdown-item:hover {
    background: rgba(179, 32, 50, 0.18);
    color: #ffffff;
  }
  .dropdown-item.active {
    background: #1E2321;
    color: #ffffff;
    font-weight: 600;
  }

  /* Shortcuts */
  .shortcuts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    width: 100%;
  }
  .shortcut-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: transform 180ms var(--ease-spring), border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    will-change: transform;
  }
  .shortcut-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
  }
  .shortcut-card:active {
    transform: scale(0.98);
  }
  .shortcut-icon {
    width: 18px;
    height: 18px;
    color: var(--accent);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="window-top-bar">
    <div class="window-title">
      <span>🌐</span>
      <span>DIAD Browser</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" onclick="windowAction('minimize')" title="Minimize">–</button>
      <button class="win-btn" onclick="windowAction('maximize')" title="Maximize">□</button>
      <button class="win-btn win-close" onclick="windowAction('close')" title="Close">×</button>
    </div>
  </div>

  <div class="container">
    <div class="logo-container">
      <img src="/diad-logo-white.png" alt="DIAD" class="diad-official-logo" />
      <div class="subtitle">WORKSPACE 2 · BROWSER</div>
    </div>

    <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          id="searchInput"
          class="search-input"
          type="text" 
          placeholder="Search the web or type a URL…" 
          autocomplete="off" 
          autofocus
        />
        
        <!-- Custom Dark Dropdown -->
        <div class="custom-dropdown" id="engineDropdown">
          <button type="button" class="dropdown-trigger" id="dropdownTrigger">
            <span id="selectedEngineName">DuckDuckGo</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item active" data-value="duckduckgo" onclick="selectEngine('duckduckgo', 'DuckDuckGo')">DuckDuckGo</div>
            <div class="dropdown-item" data-value="searxng" onclick="selectEngine('searxng', 'SearXNG')">SearXNG</div>
            <div class="dropdown-item" data-value="brave" onclick="selectEngine('brave', 'Brave')">Brave</div>
            <div class="dropdown-item" data-value="google" onclick="selectEngine('google', 'Google')">Google</div>
            <div class="dropdown-item" data-value="wikipedia" onclick="selectEngine('wikipedia', 'Wikipedia')">Wikipedia</div>
          </div>
        </div>
      </div>
    </form>

    <div class="shortcuts-grid">
      <a class="shortcut-card" href="https://github.com" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
        </svg>
        <span>GitHub</span>
      </a>
      <a class="shortcut-card" href="https://news.ycombinator.com" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>Hacker News</span>
      </a>
      <a class="shortcut-card" href="https://reddit.com" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12a2 2 0 1 0 4 0 2 2 0 1 0-4 0"></path>
          <path d="M12 12a2 2 0 1 0 4 0 2 2 0 1 0-4 0"></path>
        </svg>
        <span>Reddit</span>
      </a>
      <a class="shortcut-card" href="https://wikipedia.org" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Wikipedia</span>
      </a>
      <a class="shortcut-card" href="https://youtube.com" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
          <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
        </svg>
        <span>YouTube</span>
      </a>
      <a class="shortcut-card" href="https://claude.ai" target="_self">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Claude</span>
      </a>
    </div>
  </div>

  <script>
    const input = document.getElementById("searchInput");
    const dropdown = document.getElementById("engineDropdown");
    const trigger = document.getElementById("dropdownTrigger");
    const selectedName = document.getElementById("selectedEngineName");
    let currentEngine = "duckduckgo";

    // Auto-focus search on load
    input.focus();
    window.addEventListener("keydown", (e) => {
      if (document.activeElement !== input && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        input.focus();
      }
    });

    // Toggle dropdown
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });

    window.addEventListener("click", () => {
      dropdown.classList.remove("open");
    });

    function selectEngine(val, label) {
      currentEngine = val;
      selectedName.textContent = label;
      document.querySelectorAll(".dropdown-item").forEach(el => {
        el.classList.toggle("active", el.getAttribute("data-value") === val);
      });
      dropdown.classList.remove("open");
      input.focus();
    }

    function handleSearch(e) {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      // If it looks like a URL, navigate directly
      if (/^(https?:\/\/|[a-zA-Z0-9.-]+\.[a-zA-Z]{2,})(\/.*)?$/.test(query)) {
        const url = query.startsWith("http://") || query.startsWith("https://") ? query : "https://" + query;
        window.location.href = url;
        return;
      }

      // Search engine dispatch
      const encoded = encodeURIComponent(query);
      let target = "";

      switch (currentEngine) {
        case "duckduckgo":
          target = `https://duckduckgo.com/?q=${encoded}`;
          break;
        case "searxng":
          target = `https://searx.be/search?q=${encoded}`;
          break;
        case "brave":
          target = `https://search.brave.com/search?q=${encoded}`;
          break;
        case "google":
          target = `https://www.google.com/search?q=${encoded}`;
          break;
        case "wikipedia":
          target = `https://en.wikipedia.org/wiki/Special:Search?search=${encoded}`;
          break;
        default:
          target = `https://duckduckgo.com/?q=${encoded}`;
      }

      window.location.href = target;
    }

    async function windowAction(action) {
      try {
        await fetch('/api/v1/window', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
      } catch (err) {
        console.error('Window action error:', err);
      }
    }
  </script>
  <div class="corner-resize-handle" title="Resize Window (Drag corner or Super+Right Click)">↘</div>
</body>
</html>
